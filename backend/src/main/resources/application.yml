# Configuración general del backend Kapaq
server:
  port: ${PORT:8080}

spring:
  application:
    name: kapaq-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kapaq_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:JOAQUIN123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: kapaq-super-secret-key-2026-minimarket-spring-security-jwt-hs256
  expiration: 86400000

logging:
  level:
    com.kapaq: INFO
    org.springframework.security: INFO
