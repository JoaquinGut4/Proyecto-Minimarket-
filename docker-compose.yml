services:
  mysql:
    image: mysql:8.0
    container_name: kapaq_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-kapaq_db}
      MYSQL_USER: ${DB_USER:-kapaq_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kapaq_password}
    volumes:
      - kapaq_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kapaq_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-kapaq_db}
      DB_USER: ${DB_USER:-kapaq_user}
      DB_PASSWORD: ${DB_PASSWORD:-kapaq_password}
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  kapaq_mysql_data:
